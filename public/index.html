<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web Inbox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #efeae2; display: flex; flex-direction: column; height: 100vh; }
    header { background: #075e54; color: white; padding: 14px; font-weight: bold; }
    #chat-box { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14px; position: relative; }
    .in { background: #ffffff; align-self: flex-start; }
    .out { background: #dcf8c6; align-self: flex-end; }
    .sender { font-size: 11px; color: #555; margin-bottom: 2px; }
    .time { font-size: 10px; color: #888; text-align: right; margin-top: 4px; }
    footer { display: flex; flex-direction: column; background: #f0f0f0; padding: 8px; gap: 6px; }
    .input-row { display: flex; gap: 6px; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
    #to { width: 140px; }
    #text { flex: 1; }
    button { background: #128c7e; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <header>WhatsApp Customer Inbox</header>
  <div id="chat-box"></div>
  <footer>
    <div class="input-row">
      <input type="text" id="to" placeholder="Nomor: 628xxx" />
      <input type="text" id="text" placeholder="Ketik balasan..." />
      <button onclick="kirimPesan()">Kirim</button>
    </div>
  </footer>

  <script>
    async function muatPesan() {
      try {
        const res = await fetch('/api/messages');
        const data = await res.json();
        const box = document.getElementById('chat-box');
        box.innerHTML = '';
        data.forEach(m => {
          const div = document.createElement('div');
          div.className = `msg ${m.direction}`;
          div.innerHTML = `
            <div class="sender">${m.direction === 'in' ? m.from : 'Saya'}</div>
            <div>${m.text}</div>
            <div class="time">${m.time}</div>
          `;
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
      } catch (err) {}
    }

    async function kirimPesan() {
      const to = document.getElementById('to').value.trim();
      const text = document.getElementById('text').value.trim();
      if (!to || !text) return alert('Nomor dan pesan harus diisi!');

      const res = await fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to, text })
      });

      const hasil = await res.json();
      if (hasil.success) {
        document.getElementById('text').value = '';
        muatPesan();
      } else {
        alert('Gagal: ' + JSON.stringify(hasil.error));
      }
    }

    setInterval(muatPesan, 3000);
    muatPesan();
  </script>
</body>
</html>
